<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https: wss:">
    <title>E2E Chat</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">

    <script src="./login.js"></script>
</head>


<body>
    <br><br><br><br>
    <div style="width:400px; margin:0 auto;">
        <div class="form-group">
            <p id="error-msg" style="color: red;"></p>
            <label for="inputUserName" style="font-weight: bold; margin-bottom: 0.5em;">Username</label>
            <input type="text" class="form-control" name="username" id="inputUserName" placeholder="Enter name" autofocus>
            <label for="inputPassword" style="font-weight: bold; margin-bottom: 0.5em;">Password (min 8 chars, 1 uppercase, 1 digit, 1 special)</label>
            <input type="password" class="form-control" name="password" id="inputPassword" minlength="8" placeholder="Enter a password">

        </div>
        
        <button type="button" id="btn-login" class="btn btn-primary" style="margin-top: 1em;">Login</button>
        <button type="button" id="btn-register" class="btn btn-primary" style="margin-top: 1em;">Register</button>

    </div>
</body>

</html>

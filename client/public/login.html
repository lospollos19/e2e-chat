<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Insecure Chat</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">

    <script type="text/javascript">
        const ipcRenderer = require('electron').ipcRenderer;
        const socket      = require('socket.io-client')('http://localhost:3000');
        const crypto      = require('crypto');

        let currentName              = null;
        let currentPassword          = null;
        let pendingEncryptedPrivKey  = null;

        function login() {
            currentName     = document.getElementById("inputUserName").value;
            currentPassword = document.getElementById("inputPassword").value;
            socket.emit('login', { name: currentName, password: currentPassword });
        }

        function validate(name, password) {
            if (!name || /\s/.test(name))
                return 'Username must be a single word (no spaces)';
            if (password.length < 8)
                return 'Password must be at least 8 characters';
            if (!/[A-Z]/.test(password))
                return 'Password must contain at least one uppercase letter';
            if (!/[0-9]/.test(password))
                return 'Password must contain at least one digit';
            if (!/[^A-Za-z0-9]/.test(password))
                return 'Password must contain at least one special character';
            return null;
        }

        function register() {
            currentName     = document.getElementById("inputUserName").value;
            currentPassword = document.getElementById("inputPassword").value;
            const err = validate(currentName, currentPassword);
            if (err) {
                document.getElementById('error-msg').textContent = err;
                return;
            }
            const { publicKey, privateKey } = crypto.generateKeyPairSync('rsa', {
                modulusLength:      2048,
                publicKeyEncoding:  { type: 'spki',  format: 'pem' },
                privateKeyEncoding: { type: 'pkcs8', format: 'pem' }
            });
            const salt   = crypto.randomBytes(16);
            const aesKey = crypto.pbkdf2Sync(currentPassword, salt, 100000, 32, 'sha256');
            const iv     = crypto.randomBytes(12);
            const cipher = crypto.createCipheriv('aes-256-gcm', aesKey, iv);
            let encData  = cipher.update(privateKey, 'utf8', 'hex');
            encData     += cipher.final('hex');
            pendingEncryptedPrivKey = {
                iv:      iv.toString('hex'),
                data:    encData,
                authTag: cipher.getAuthTag().toString('hex'),
                salt:    salt.toString('hex')
            };
            socket.emit('register', {
                name:                currentName,
                password:            currentPassword,
                publicKey:           publicKey,
                encryptedPrivateKey: pendingEncryptedPrivKey
            });
        }

        socket.on('login_ok', (data) => {
            ipcRenderer.send('open-chat', {
                name:                currentName,
                password:            currentPassword,
                encryptedPrivateKey: data.encryptedPrivateKey || null
            });
        });

        socket.on('login_error', (err) => {
            document.getElementById('error-msg').textContent = err.message;
        });

        socket.on('register_ok', () => {
            ipcRenderer.send('open-chat', {
                name:                currentName,
                password:            currentPassword,
                encryptedPrivateKey: pendingEncryptedPrivKey
            });
        });

        socket.on('register_error', (err) => {
            document.getElementById('error-msg').textContent = err.message;
        });
    </script>
</head>


<body>
    <br><br><br><br>
    <div style="width:400px; margin:0 auto;">
        <div class="form-group">
            <p id="error-msg" style="color: red;"></p>
            <label for="inputUserName" style="font-weight: bold; margin-bottom: 0.5em;">Username</label>
            <input type="string" class="form-control" name="username" id="inputUserName" placeholder="Enter name" autofocus>
            <label for="inputUserName" style="font-weight: bold; margin-bottom: 0.5em;">Password (min 8 chars, 1 uppercase, 1 digit, 1 special)</label>
            <input type="password" class="form-control" name="password" id="inputPassword" minlength="8" placeholder="Enter a password" autofocus>

        </div>
        
        <button type="submit" class="btn btn-primary" style="margin-top: 1em;" onclick="login()" >Login</button>
        <button type="submit" class="btn btn-primary" style="margin-top: 1em;" onclick="register()" >Register</button>

    </div>
</body>

</html>
